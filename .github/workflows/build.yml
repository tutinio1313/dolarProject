name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker-compose build --no-cache
        env:
          POSTGRESQL_CONNECTION_STRING: ${{ secrets.POSTGRESQL_CONNECTION_STRING || 'postgresql://postgres:password@database:5432/dolardb' }}
          POSTGRESQL_USER: ${{secrets.POSTGRESQL_USER}}
          POSTGRESQL_DATABASE: ${{secrets.POSTGRESQL_DATABASE}}
          POSTGRESQL_PASSWORD: ${{secrets.POSTGRESQL_PASSWORD}}
          API_URL: ${{ env.API_URL }}
          HISTORICAL_API_URL: ${{ env.API_URL }}
          VALKEY_IP: ${{ env.VALKEY_IP || 6379 }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD || 'valkeypassword' }}

      - name: Verify images were built
        run: |
          docker images
