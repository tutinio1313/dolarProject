services:
  backend:
    build:
      context: ./
      dockerfile: ./backend/dockerfile
    ports:
      ["1313:1313","1331:1331"]
    environment:
      ASPNET_CREDENTIAL_FILE_DEFAULT : "./aspnetapp.pfx"
      ASPNET_CREDENTIAL_FILE_PASSWORD : "wyrmxqcwxrQUNfekEHFYFFrwNYnCLw"
      CONNECTION_STRING : ${POSTGRESQL_CONNECTION_STRING}
      API_URL : ${API_URL}
      HISTORIC_USD_API_URL : ${HISTORICAL_API_URL}
      VALKEY_IP : ${VALKEY_IP}
      VALKEY_PASSWORD : ${VALKEY_PASSWORD}

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_PASSWORD : ${POSTGRESQL_PASSWORD}
    ports:
      - "5432:5432"
  
  batchjobs:
    build:
      context: ./
      dockerfile: ./worker/dockerfile
    environment:
      SQLConnectionString : ${POSTGRESQL_CONNECTION_STRING}
      VALKEY_IP : ${VALKEY_IP}
      VALKEY_PASSWORD : ${VALKEY_PASSWORD}
      API_URL : ${API_URL}
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 591:8080
    depends_on :
      - database

  frontend:
    build:
      context: ./
      dockerfile: ./frontend/dockerfile
    ports:
      ["80:80","433:433"]

  valkey:
    container_name: valkey
    hostname: valkey
    image: valkey/valkey:latest
    command: valkey-server --port ${VALKEY_IP} --requirepass ${VALKEY_PASSWORD}
    expose:
      - ${VALKEY_IP}